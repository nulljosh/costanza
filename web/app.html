<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Co-Stanza</title>
<meta name="description" content="A quiet place to post poems.">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://heyitsmejosh.com/tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg, #fafafa); color: var(--text, #111); font-family: var(--font-body, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif); line-height: 1.7; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.25rem clamp(1rem, 5vw, 3rem); border-bottom: 1px solid var(--border, #eee); }
  header a.brand { font-weight: 700; letter-spacing: -.02em; }
  header nav { display: flex; gap: 1.25rem; font-size: .9rem; color: var(--text2, #555); }
  main { max-width: 38rem; margin: 0 auto; padding: 3rem clamp(1rem, 5vw, 3rem) 6rem; }
  .poem { padding: 2.5rem 0; border-bottom: 1px solid var(--border, #eee); }
  .poem h2 { font-size: 1.4rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; }
  .poem .by { font-size: .85rem; color: var(--text2, #555); margin: .25rem 0 1.25rem; display: flex; align-items: center; gap: .4rem; }
  .avatar { border-radius: 4px; display: inline-block; vertical-align: middle; }
  .profile-head { display: flex; align-items: center; gap: .9rem; margin-bottom: 1.5rem; }
  .profile-head .avatar { width: 48px; height: 48px; border-radius: 8px; }
  .poem p { white-space: pre-wrap; margin-bottom: 1.25rem; }
  .poem p:last-child { margin-bottom: 0; }
  .single .poem { border: 0; }
  .single .poem h2 { font-size: 2rem; }
  .single .poem p { font-size: 1.1rem; }
  .back { display: inline-block; font-size: .9rem; color: var(--text2, #555); margin-bottom: 1rem; }
  form { display: grid; gap: .75rem; }
  input, textarea { width: 100%; padding: .7rem .9rem; border: 1px solid var(--border2, #ddd); border-radius: var(--radius-sm, 8px); background: var(--bg, #fff); }
  textarea { min-height: 18rem; line-height: 1.7; resize: vertical; }
  .btn { padding: .7rem 1.2rem; border-radius: var(--radius-sm, 8px); background: var(--text, #111); color: var(--bg, #fff); font-weight: 600; justify-self: start; }
  .btn:disabled { opacity: .5; cursor: default; }
  .muted { color: var(--text2, #555); font-size: .9rem; }
  .danger { color: var(--text2, #555); font-size: .8rem; margin-top: 1rem; }
  .empty { padding: 4rem 0; text-align: center; color: var(--text2, #555); }
  .err { color: #b00020; font-size: .9rem; }
  h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -.02em; margin-bottom: 1.5rem; }
  .embed header { display: none; }
  .oauth-btn { display: flex; align-items: center; justify-content: center; gap: .5rem; height: 44px; border-radius: var(--radius-sm, 8px); font-weight: 500; font-size: .9375rem; }
  .oauth-apple { background: #000; color: #fff; border: none; }
  .oauth-apple:hover { background: #1a1a1a; }
  .oauth-google { background: #fff; color: #1f1f1f; border: 1px solid #747775; }
  .oauth-google:hover { background: #f7f7f7; }
  .oauth-github { background: #181717; color: #fff; border: none; }
  .oauth-github:hover { background: #2b2b2b; }
  .oauth-x { background: #000; color: #fff; border: none; }
  .oauth-x:hover { background: #1a1a1a; }
</style>
<script>if(/[?&]embed\b/.test(location.search))document.documentElement.classList.add('embed')</script>
</head>
<body>
<header>
  <a class="brand" href="#/">Co-Stanza</a>
  <nav>
    <a href="#/write">Write</a>
    <a href="#/account" id="who">Sign in</a>
  </nav>
</header>
<main id="main"><p class="muted">Loading</p></main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { esc, renderBody, when, slug } from './poem.js';

const sb = createClient('https://tjsxsqlxjmanwvmywwvw.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqc3hzcWx4am1hbnd2bXl3d3Z3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0OTc0MDEsImV4cCI6MjA4NjA3MzQwMX0.LphLfho3wdQC20MhtcnBpzQUNuBoTOobrugQbNGxc68');
const main = document.getElementById('main');
const who = document.getElementById('who');
let user = null;

// Deterministic pixel avatar seeded by pen name -- no schema change, no storage,
// same name always renders the same little icon.
function avatarSvg(seed) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  const rand = () => { h = (h * 1103515245 + 12345) >>> 0; return h / 4294967296; };
  const palettes = [['#B5836A', '#7C93A6', '#4A5A68'], ['#7C8B6B', '#A8B99A', '#CBD8BE'], ['#0077b6', '#00b4d8', '#90e0ef'], ['#A5735C', '#D2A88E', '#E3B778'], ['#2d6a4f', '#52b788', '#b7e4c7']];
  const bgs = ['#111', '#0c1220', '#1a1a1a', '#0f0f1a', '#0a1a0a'];
  const palette = palettes[Math.floor(rand() * palettes.length)];
  const bg = bgs[Math.floor(rand() * bgs.length)];
  const px = 8, size = 8, total = size * px;
  let rects = '';
  for (let row = 0; row < size; row++) {
    for (let col = 0; col < Math.ceil(size / 2); col++) {
      const ci = rand() > 0.45 ? Math.floor(rand() * 3) : -1;
      if (ci < 0) continue;
      const c = palette[ci];
      rects += `<rect x="${col * px}" y="${row * px}" width="${px}" height="${px}" fill="${c}"/>`;
      if (col < size - 1 - col) rects += `<rect x="${(size - 1 - col) * px}" y="${row * px}" width="${px}" height="${px}" fill="${c}"/>`;
    }
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}" width="${total}" height="${total}" shape-rendering="crispEdges"><rect width="${total}" height="${total}" fill="${bg}"/>${rects}</svg>`;
  return `data:image/svg+xml;base64,${btoa(svg)}`;
}

const card = (p, single = false) => `
  <article class="poem">
    <h2>${single ? esc(p.title) : `<a href="${slug(p.id)}">${esc(p.title)}</a>`}</h2>
    <div class="by"><img class="avatar" src="${avatarSvg(p.pen_name)}" width="20" height="20" alt=""><a href="#/by/${esc(p.pen_name)}">${esc(p.pen_name)}</a> · ${when(p.created_at)}</div>
    ${renderBody(p.body)}
    ${single && user && user.id === p.user_id ? `<button class="danger" data-del="${p.id}">Delete this poem</button>` : ''}
  </article>`;

const q = () => sb.from('stanza_poems').select('*').order('created_at', { ascending: false });

const views = {
  async home() {
    const { data } = await q().limit(50);
    main.innerHTML = data?.length ? data.map((p) => card(p)).join('') : '<p class="empty">Nothing here yet. Write the first one.</p>';
  },
  async by(name) {
    const { data } = await q().eq('pen_name', name).limit(100);
    const head = `<div class="profile-head"><img class="avatar" src="${avatarSvg(name)}" width="48" height="48" alt=""><div><h1 style="margin-bottom:.15rem">${esc(name)}</h1><p class="muted">${data?.length || 0} poem${data?.length === 1 ? '' : 's'}</p></div></div>`;
    main.innerHTML = head + (data?.length ? data.map((p) => card(p)).join('') : '<p class="empty">No poems yet.</p>');
  },
  async p(id) {
    const { data } = await sb.from('stanza_poems').select('*').eq('id', id).single();
    main.className = 'single';
    main.innerHTML = data ? `<a class="back" href="#/">Back</a>${card(data, true)}` : '<p class="empty">Not found.</p>';
  },
  write() {
    if (!user) return views.account('Sign in to write.');
    main.innerHTML = `<h1>Write</h1><form id="f">
      <input name="pen_name" placeholder="Your name" required maxlength="40" value="${esc(localStorage.pen || '')}">
      <input name="title" placeholder="Title" required maxlength="120">
      <textarea name="body" placeholder="The poem. Blank line between stanzas." required maxlength="8000"></textarea>
      <button class="btn">Publish</button><span class="err" id="e"></span></form>`;
    document.getElementById('f').onsubmit = async (ev) => {
      ev.preventDefault();
      const row = Object.fromEntries(new FormData(ev.target));
      ev.target.querySelector('.btn').disabled = true;
      const { data, error } = await sb.from('stanza_poems').insert({ ...row, user_id: user.id }).select().single();
      if (error) { document.getElementById('e').textContent = error.message; ev.target.querySelector('.btn').disabled = false; return; }
      localStorage.pen = row.pen_name;
      location.hash = slug(data.id);
    };
  },
  async account(msg = '') {
    if (user) {
      const { data } = await q().eq('user_id', user.id).limit(100);
      const seed = (localStorage.pen || user.email) + (localStorage.avatarSalt || '');
      const head = `<div class="profile-head"><img class="avatar" id="myAvatar" src="${avatarSvg(seed)}" width="48" height="48" alt="" title="Click for a new avatar" style="cursor:pointer"><div><h1 style="margin-bottom:.15rem">${esc(localStorage.pen || 'Account')}</h1><p class="muted">${esc(user.email)}</p></div></div>`;
      main.innerHTML = head + `<p style="margin-top:1rem"><button class="btn" id="out">Sign out</button></p>
        <h1 style="margin-top:2.5rem">Your poems</h1>` + (data?.length ? data.map((p) => card(p)).join('') : '<p class="empty">Nothing published yet.</p>');
      document.getElementById('out').onclick = async () => { await sb.auth.signOut(); location.hash = '#/'; };
      document.getElementById('myAvatar').onclick = () => {
        localStorage.avatarSalt = Math.random().toString(36).slice(2);
        views.account();
      };
      return;
    }
    main.innerHTML = `<h1>Sign in</h1><p class="muted">${esc(msg)}</p><form id="f" style="margin-top:1rem">
      <input type="email" name="email" placeholder="Email" required autocomplete="email">
      <input type="password" name="password" placeholder="Password" required minlength="6" autocomplete="current-password">
      <div style="display:flex;gap:.75rem"><button class="btn" value="in">Sign in</button><button class="btn" value="up" style="background:none;color:inherit;border:1px solid var(--border2,#ddd)">Create account</button></div>
      <span class="err" id="e"></span>
      <a class="muted" href="#/forgot">Forgot password?</a></form>
      <p class="muted" style="margin-top:1.25rem">or</p>
      <div style="display:grid;gap:.6rem;margin-top:.5rem">
        <button class="oauth-btn oauth-apple" id="oauthApple"><svg viewBox="0 0 384 512" width="16" height="16" fill="currentColor"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141 4 184.8 4 273.9c0 26.7 4.9 54.3 14.7 82.8 13.1 37.4 60.4 129 109.8 127.4 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 49.8-.7 92.6-83.8 105.1-121.3-66.8-31.5-67.1-92.4-67.1-93.1zm-56.6-164.2c26.6-31.6 24.2-60.4 23.4-70.6-23.5 1.4-50.7 16.1-66.1 34.4-17 19.4-27 43.4-24.9 69.3 24.9 1.9 47.6-11.7 67.6-33.1z"/></svg>Continue with Apple</button>
        <button class="oauth-btn oauth-google" id="oauthGoogle"><svg viewBox="0 0 48 48" width="18" height="18"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.3 1 7.3 2.7l5.7-5.7C33.6 6.5 29 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5 43.5 34.8 43.5 24c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c2.8 0 5.3 1 7.3 2.7l5.7-5.7C33.6 6.5 29 4.5 24 4.5c-7.7 0-14.4 4.4-17.7 10.2z"/><path fill="#4CAF50" d="M24 43.5c5 0 9.5-1.9 12.9-5.1l-6-5c-1.9 1.4-4.4 2.1-6.9 2.1-5.3 0-9.7-3.6-11.3-8.4l-6.6 5.1C9.5 39 16.2 43.5 24 43.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.4 5.7l6 5c-.4.4 6.6-4.8 6.6-14.7 0-1.2-.1-2.4-.4-3.5z"/></svg>Continue with Google</button>
        <button class="oauth-btn oauth-github" id="oauthGithub"><svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>Continue with GitHub</button>
        <button class="oauth-btn oauth-x" id="oauthX"><svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M18.9 1.2h3.7l-8 9.2 9.5 12.4h-7.4l-5.8-7.6-6.6 7.6H.6l8.6-9.9L0 1.2h7.6l5.3 7 6-7zm-1.3 19.3h2L6.5 3.4h-2.1l13.2 17.1z"/></svg>Continue with X</button>
      </div>`;
    document.getElementById('f').onsubmit = async (ev) => {
      ev.preventDefault();
      const creds = Object.fromEntries(new FormData(ev.target));
      const up = ev.submitter?.value === 'up';
      const { error } = up
        ? await sb.auth.signUp({ ...creds, options: { emailRedirectTo: location.origin + '/app' } })
        : await sb.auth.signInWithPassword(creds);
      document.getElementById('e').textContent = error ? error.message : up ? 'Check your email to confirm.' : '';
      if (!error && !up) location.hash = '#/write';
    };
    document.getElementById('oauthApple').onclick = () => sb.auth.signInWithOAuth({ provider: 'apple', options: { redirectTo: location.origin + '/app' } });
    document.getElementById('oauthGoogle').onclick = () => sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + '/app' } });
    document.getElementById('oauthGithub').onclick = () => sb.auth.signInWithOAuth({ provider: 'github', options: { redirectTo: location.origin + '/app' } });
    document.getElementById('oauthX').onclick = () => sb.auth.signInWithOAuth({ provider: 'x', options: { redirectTo: location.origin + '/app' } });
  },
  forgot() {
    main.innerHTML = `<h1>Reset password</h1><p class="muted">We email you a link.</p><form id="f" style="margin-top:1rem">
      <input type="email" name="email" placeholder="Email" required autocomplete="email">
      <button class="btn">Send link</button><span class="err" id="e"></span></form>`;
    document.getElementById('f').onsubmit = async (ev) => {
      ev.preventDefault();
      const { error } = await sb.auth.resetPasswordForEmail(new FormData(ev.target).get('email'), { redirectTo: location.origin + '/app#/reset' });
      document.getElementById('e').textContent = error ? error.message : 'Check your email.';
    };
  },
  reset() {
    main.innerHTML = `<h1>New password</h1><form id="f" style="margin-top:1rem">
      <input type="password" name="password" placeholder="New password" required minlength="6" autocomplete="new-password">
      <button class="btn">Save</button><span class="err" id="e"></span></form>`;
    document.getElementById('f').onsubmit = async (ev) => {
      ev.preventDefault();
      const { error } = await sb.auth.updateUser({ password: new FormData(ev.target).get('password') });
      document.getElementById('e').textContent = error ? error.message : '';
      if (!error) location.hash = '#/write';
    };
  },
};

async function route() {
  main.className = '';
  const [, v = 'home', arg] = location.hash.split('/');
  const fn = views[v] || views.home;
  await fn(arg ? decodeURIComponent(arg) : undefined);
  window.scrollTo(0, 0);
}
main.onclick = async (e) => {
  const id = e.target.dataset?.del;
  if (!id || !confirm('Delete this poem?')) return;
  await sb.from('stanza_poems').delete().eq('id', id);
  location.hash = '#/';
};
sb.auth.onAuthStateChange((event, session) => {
  user = session?.user || null;
  if (event === 'PASSWORD_RECOVERY') location.hash = '#/reset';
  who.textContent = user ? (localStorage.pen || user.email) : 'Sign in';
  route();
});
window.addEventListener('hashchange', route);
route(); // ponytail: don't gate first paint on the auth check, the listener re-routes once it resolves
</script>
</body>
</html>
